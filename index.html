<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 포토부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b24; --panel:#0f1640; --line:#24306e; --ink:#f2f5ff; --muted:#9aa6d8;
    --accent:#5b6cff; --accent2:#38e1ff; --ok:#3ee08f; --warn:#ffb547;
    --fun:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;cursor:pointer}

  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
    padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
  .brand{font-family:var(--fun);font-size:clamp(22px,3vw,30px);letter-spacing:.5px}
  .brand small{font-size:.55em;color:var(--muted);margin-left:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted);white-space:nowrap}
  .chip.ok{color:var(--ok);border-color:#2c6b4f}
  .chip.warn{color:var(--warn);border-color:#6b5228}

  /* 카메라 영역 */
  .stage{container-type:size;display:grid;place-items:center;min-height:0}
  .viewport{position:relative;border-radius:22px;overflow:hidden;background:#000;
    box-shadow:0 0 0 3px var(--line),0 20px 60px rgba(0,0,0,.5);
    width:min(100cqw, calc(100cqh * 3 / 2));aspect-ratio:3/2;transition:width .3s}
  .viewport.portrait{width:min(100cqw, calc(100cqh * 3 / 4));aspect-ratio:3/4}
  .viewport video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .viewport canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .result-img{display:none;max-width:100cqw;max-height:100cqh;border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}

  .mission{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-140%);
    background:rgba(7,11,36,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:12px 26px 14px;text-align:center;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);min-width:min(80%,360px)}
  .mission.show{transform:translateX(-50%) translateY(0)}
  .mission .step{font-size:13px;color:var(--accent2);letter-spacing:1px}
  .mission .title{font-family:var(--fun);font-size:clamp(26px,4.2cqw,44px);line-height:1.15;margin:2px 0}
  .mission .desc{font-size:clamp(14px,1.8cqw,19px);color:#dfe1ff}

  .timer{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
  .timer.show{opacity:1}
  .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transform-origin:left}

  .banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;
    font-family:var(--fun);font-size:clamp(30px,5.5cqw,58px);padding:12px 30px;border-radius:20px;
    background:rgba(14,15,31,.78);white-space:nowrap;transition:all .25s cubic-bezier(.2,1.4,.4,1)}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);
    font-size:clamp(120px,24cqw,260px);color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.6);opacity:0}
  .count.pop{animation:pop .9s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(1.8)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  .camerr{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:16px;text-align:center;padding:30px;
    font-size:18px;line-height:1.6;color:var(--muted);background:#0b0c19}
  .camerr .secondary{color:var(--ink)}
  .viewport .democam{display:none;object-fit:cover}
  .viewport.demo .democam{display:block}
  .viewport.demo video{display:none}

  /* 하단 패널 */
  .panel{display:none;padding-top:14px;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .panel.active{display:flex}
  .modes{display:flex;gap:12px}
  .mode{position:relative;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border-radius:18px;
    background:var(--panel);border:2px solid var(--line);text-align:left;transition:all .15s}
  .mode b{display:block;font-family:var(--fun);font-weight:400;font-size:20px}
  .mode span{font-size:13px;color:var(--muted)}
  .mode.sel{border-color:var(--accent2);background:#152060;box-shadow:0 0 0 4px rgba(56,225,255,.2)}
  .mode .rec{position:absolute;top:-10px;right:10px;font-size:11px;padding:2px 8px;border-radius:99px;
    background:var(--accent2);color:#06302c;font-weight:700;display:none}
  .mode.recommended .rec{display:block}
  .primary{font-family:var(--fun);font-size:26px;padding:16px 34px;border-radius:20px;
    background:linear-gradient(135deg,#4f5bff,#22b8ee);box-shadow:0 8px 30px rgba(56,140,255,.45)}
  .primary:disabled{opacity:.55}
  .primary:active,.mode:active,.secondary:active{transform:scale(.97)}
  .secondary{font-family:var(--fun);font-size:20px;padding:14px 22px;border-radius:18px;background:var(--panel);border:2px solid var(--line)}
  .ghost{font-size:13px;color:var(--muted);background:none;padding:8px;text-decoration:underline}
  .countchip{font-family:var(--fun);font-size:20px;padding:10px 18px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
  .countchip em{font-style:normal;color:var(--accent2)}

  .thumbs{display:flex;gap:10px}
  .thumb{width:90px;aspect-ratio:3/2;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;
    color:var(--muted);font-size:13px;overflow:hidden;background:#0b0c19 center/cover no-repeat}
  .thumb.portrait{width:60px;aspect-ratio:3/4}
  .thumb.done{border-style:solid;border-color:var(--accent2)}
  .thumb.now{border-color:var(--accent);color:var(--ink)}

  .report{max-width:min(620px,100%);text-align:center}
  .report .c1{font-family:var(--fun);font-size:24px}
  .report .c2{font-size:15px;color:var(--muted);margin-top:4px}
  .qrbox{display:none;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--panel);border:2px solid var(--accent2)}
  .qrbox.show{display:flex}
  .qrbox canvas{width:150px;height:150px;border-radius:10px;background:#fff}
  .qrbox div{font-size:14px;line-height:1.45;color:var(--muted)}
  .qrbox b{font-family:var(--fun);font-weight:400;font-size:19px;color:var(--ink)}
  .idle{font-size:13px;color:var(--muted);width:100%;text-align:center}

.livecount{position:absolute;right:14px;bottom:20px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;
    background:rgba(7,11,36,.72);border:1px solid rgba(56,225,255,.5);color:#bff4ff;display:none}
  .livecount.show{display:block}
  .debug{position:absolute;left:10px;bottom:16px;background:rgba(0,0,0,.7);border-radius:12px;padding:10px 12px;
    font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe;display:none;max-width:60%;white-space:pre-wrap}
  .debug.show{display:block}

  @media (max-width:760px){ .modes{flex-direction:column;width:100%} .mode{width:100%} .primary{width:100%} }

  /* 일반 네컷 모드 */
  body.classic{--bg:#141416;--panel:#1f1f23;--line:#34343a;--accent:#ff8fb1;--accent2:#ffcf70;--muted:#b7b2bd}
  body.classic .primary{background:linear-gradient(135deg,#ff7aa8,#ffb36b);box-shadow:0 8px 30px rgba(255,122,168,.35)}
  body.classic .mode.sel{border-color:var(--accent);background:#2a2027;box-shadow:0 0 0 4px rgba(255,143,177,.2)}
  body.classic .mode .rec{background:var(--accent);color:#3a0f1d}
  body.classic .countchip em{color:var(--accent)}
  body.classic .livecount{border-color:rgba(255,143,177,.5);color:#ffe3ec}
  .themes{display:none;width:100%;justify-content:center;gap:8px;flex-wrap:wrap}
  body.classic .themes{display:flex}
  .tchip{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;font-family:var(--fun);font-size:17px;
    border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .15s}
  .tchip.sel{border-color:#fff;box-shadow:0 0 0 3px var(--accent);transform:translateY(-2px)}
  .tchip:active{transform:scale(.96)}
  .secret{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));
    width:36px;height:36px;border-radius:50%;background:none;color:var(--muted);opacity:.18;font-size:15px;z-index:5}
  .pinmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:20;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .pinmodal.show{display:grid}
  .pinbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 22px 18px;width:min(320px,90vw);text-align:center}
  .pintitle{font-family:var(--fun);font-size:22px}
  .pinsub{font-size:13px;color:var(--muted);margin:4px 0 14px;min-height:18px}
  .pindots{display:flex;justify-content:center;gap:14px;margin-bottom:16px}
  .pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
  .pindots i.on{background:var(--ink);border-color:var(--ink)}
  .pindots.bad{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pinpad button{height:56px;border-radius:16px;background:#0000;border:1px solid var(--line);font-size:22px}
  .pinpad button.t{font-size:15px;color:var(--muted)}
  .pinpad button:active{background:var(--line)}
  .modepick{display:none;flex-direction:column;gap:8px;margin-top:4px}
  .pinbox.picking .pinpad,.pinbox.picking .pindots{display:none}
  .pinbox.picking .modepick{display:flex}
  .modepick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;
    background:#0000;border:1px solid var(--line);text-align:left}
  .modepick button b{font-family:var(--fun);font-weight:400;font-size:18px}
  .modepick button span{font-size:12px;color:var(--muted)}
  .modepick button.cur{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
  .modepick button.cancel{align-items:center;color:var(--muted);font-size:14px;padding:10px}

  /* 인쇄: 결과 이미지 한 장만 4x6 꽉 차게 */
  #printArea{display:none}
  @media print{
    @page{size:100mm 148mm;margin:0}
    html,body{height:auto;overflow:visible;background:#fff}
    body > *{display:none !important}
    #printArea{display:block !important;width:100mm;height:148mm;margin:0;padding:0}
    #printArea img{display:block;width:100%;height:100%;object-fit:cover}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span id="brandIco">🤖</span> <span id="eventName">오늘의 AI포토</span><small id="brandSub">AI 포즈 미션 네컷</small></div>
    <div id="aiStatus" class="chip">🧠 AI 불러오는 중…</div>
  </header>

  <main class="stage">
    <div id="viewport" class="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="demoCam" class="democam" width="1280" height="720"></canvas>
      <canvas id="overlay"></canvas>
      <div id="mission" class="mission">
        <div class="step" id="mStep">MISSION 1 / 4</div>
        <div class="title" id="mTitle">😆 광대 승천</div>
        <div class="desc" id="mDesc">최대한 활짝 웃어주세요!</div>
      </div>
      <div id="timer" class="timer"><i id="timerFill"></i></div>
      <div id="banner" class="banner"></div>
      <div id="count" class="count"></div>
      <div id="flash" class="flash"></div>
      <div id="camErr" class="camerr"></div>
      <div id="debug" class="debug"></div>
      <div id="liveCount" class="livecount">👥 0명 인식 중</div>
    </div>
    <img id="resultImg" class="result-img" alt="촬영 결과">
  </main>

  <!-- 시작 화면 -->
  <section id="pStart" class="panel active">
    <div id="countChip" class="countchip">👀 AI가 인원을 세는 중…</div>
    <div id="themes" class="themes"></div>
    <div class="modes">
      <button class="mode" data-mode="2">
        <svg width="34" height="50" viewBox="0 0 34 50"><rect x="1" y="1" width="32" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="17" y1="1" x2="17" y2="49" stroke="currentColor" stroke-dasharray="3 3"/><g fill="currentColor" opacity=".55"><rect x="5" y="5" width="8" height="8"/><rect x="5" y="16" width="8" height="8"/><rect x="5" y="27" width="8" height="8"/><rect x="5" y="38" width="8" height="6"/><rect x="21" y="5" width="8" height="8"/><rect x="21" y="16" width="8" height="8"/><rect x="21" y="27" width="8" height="8"/><rect x="21" y="38" width="8" height="6"/></g></svg>
        <div><b>2장으로 자르기</b><span>세로 네컷 스트립 · 1~2명</span></div>
        <i class="rec">AI 추천</i>
      </button>
      <button class="mode" data-mode="4">
        <svg width="34" height="50" viewBox="0 0 34 50"><rect x="1" y="1" width="32" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="17" y1="1" x2="17" y2="49" stroke="currentColor" stroke-dasharray="3 3"/><line x1="9" y1="1" x2="9" y2="49" stroke="currentColor" stroke-dasharray="2 2"/><line x1="1" y1="25" x2="17" y2="25" stroke="currentColor" stroke-dasharray="2 2"/><g fill="currentColor" opacity=".55"><rect x="3" y="4" width="4" height="4"/><rect x="3" y="10" width="4" height="4"/><rect x="3" y="16" width="4" height="4"/><rect x="11" y="4" width="4" height="4"/><rect x="11" y="10" width="4" height="4"/><rect x="11" y="16" width="4" height="4"/><rect x="3" y="28" width="4" height="4"/><rect x="3" y="34" width="4" height="4"/><rect x="3" y="40" width="4" height="4"/><rect x="11" y="28" width="4" height="4"/><rect x="11" y="34" width="4" height="4"/><rect x="11" y="40" width="4" height="4"/><rect x="21" y="5" width="8" height="8"/><rect x="21" y="16" width="8" height="8"/><rect x="21" y="27" width="8" height="8"/><rect x="21" y="38" width="8" height="6"/></g></svg>
        <div><b>4장으로 자르기</b><span>미니 네컷 4 + 원본 1 · 3명 이상</span></div>
        <i class="rec">AI 추천</i>
      </button>
    </div>
    <button id="startBtn" class="primary">📸 촬영 시작</button>
    <button id="qrBtn" class="ghost" style="display:none">📱 QR로 사진·영상 받기: 켜짐</button>
    <button id="debugBtn" class="ghost">🔍 인식 테스트</button>
  </section>

  <!-- 촬영 화면 -->
  <section id="pShoot" class="panel">
    <div id="thumbs" class="thumbs"></div>
    <button id="cancelBtn" class="ghost">✕ 그만하기</button>
  </section>

  <!-- 결과 화면 -->
  <section id="pResult" class="panel">
    <div class="report"><div class="c1" id="rC1"></div><div class="c2" id="rC2"></div></div>
    <div id="qrBox" class="qrbox"><canvas id="qrCanvas" width="300" height="300"></canvas>
      <div id="qrMsg"><b>📱 사진 받기</b><br>휴대폰 카메라로<br>QR을 찍어주세요</div></div>
    <button id="printBtn" class="primary">🖨️ 인쇄하기</button>
    <button id="saveBtn" class="secondary">💾 저장</button>
    <button id="homeBtn" class="secondary">🏠 처음으로</button>
    <div class="idle" id="idleMsg"></div>
  </section>
</div>

<button id="secretBtn" class="secret" aria-label="설정">✦</button>
<div id="pinModal" class="pinmodal">
  <div class="pinbox">
    <div class="pintitle">🔒 모드 전환</div>
    <div class="pinsub" id="pinSub"></div>
    <div class="pindots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="pinpad" id="pinPad"></div>
    <div class="modepick" id="modePick">
      <button data-style="ai"><b>🤖 오늘의 AI포토</b><span>AI 미션 · AI프로그래밍랩 프레임</span></button>
      <button data-style="event"><b>🎉 신나는 AI교실 개관식</b><span>AI 미션 · 개관식 행사 프레임</span></button>
      <button data-style="classic"><b>📸 오늘의 네컷</b><span>AI 없이 · 테마 프레임</span></button>
      <button class="cancel" data-style="">취소</button>
    </div>
  </div>
</div>
<div id="printArea"><img id="printImg" alt=""></div>

<script type="module">
/* =========================================================
   설정 — 행사에 맞게 여기만 바꾸면 돼요
   ========================================================= */
const CONFIG = {
  title: "오늘의 AI포토",          // 프레임 상단 제목
  footer1: "AI프로그래밍랩",       // 프레임 하단 첫째 줄
  footer2: "개포중학교",           // 프레임 하단 둘째 줄
  logo: "logo.png",              // index.html과 같은 곳에 올린 로고 파일 (없으면 글자만 표시)
  uploadUrl: "https://script.google.com/macros/s/AKfycbzwtThn3p6NJ24nsY9S9TzorNvcDhEIyDtNVQlI0Lxm8MGApLuPmPURnlSw2AngKfJnAA/exec",                 // QR 다운로드용 Apps Script 웹앱 주소 (비워두면 QR 기능 꺼짐)
  missionTimeout: 6,             // 미션 인식 제한 시간(초). 지나면 그냥 찍힘
  countdown: 3,                  // 촬영 카운트다운(초)
  classicCountdown: 5,           // 일반 네컷 모드: 컷마다 카운트다운(초)
  pin: "4209",                    // 모드 전환 암호
  holdMs: 350,                   // 포즈를 이 시간(ms) 이상 유지하면 성공
  resultIdle: 90,                // 결과 화면에서 이 시간(초) 지나면 처음으로
  timelapseMs: 350,              // 타임랩스: 이 간격(ms)마다 한 장씩 저장
  timelapseFps: 16,              // 타임랩스 영상 재생 속도 (클수록 빨라짐)
};
if (new URLSearchParams(location.search).has("fast")) { CONFIG.missionTimeout = 1; CONFIG.countdown = 1; CONFIG.classicCountdown = 1; }

const PHOTO_RATIO = 3/2;                                         // 사진·촬영 화면 비율 (가로:세로)
const MP_VERSION = "0.10.14";
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODELS = {
  face: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  gesture: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
  pose: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",

/* =========================================================
   AI 인식 헬퍼
   ========================================================= */
const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : 0;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const smileOf = b => ((b.mouthSmileLeft||0)+(b.mouthSmileRight||0))/2;
const browOf  = b => Math.max(b.browInnerUp||0, ((b.browOuterUpLeft||0)+(b.browOuterUpRight||0))/2);
const frownOf = b => ((b.mouthFrownLeft||0)+(b.mouthFrownRight||0))/2;
function faceMajority(d, fn){ const n=d.blend.length; if(!n) return false; return d.blend.filter(fn).length >= Math.ceil(n/2); }
function allFaces(d, fn){ const n=d.blend.length; return n >= 2 && d.blend.filter(fn).length >= Math.ceil(n/2); }   // 단체: 절반 이상 성공하면 통과
function gestureCount(d, name){ return d.hands.filter(h=>h.gesture===name).length; }
function headRoll(lm){ const a=lm[33], b=lm[263]; const dx=(b.x-a.x)*vw(), dy=(b.y-a.y)*vh(); return Math.abs(Math.atan2(dy,dx)*180/Math.PI); }
function angleAt(a,b,c){ const v1={x:a.x-b.x,y:(a.y-b.y)*vh()/vw()}, v2={x:c.x-b.x,y:(c.y-b.y)*vh()/vw()};
  const cos=(v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)||1); return Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI; }
function anyPose(d, fn){ return d.poses.some(p => p[11] && p[12] && fn(p, Math.abs(p[11].x-p[12].x)||0.01)); }
function isFingerHeart(lm){ const s=dist(lm[0],lm[9])||0.01; return dist(lm[4],lm[8]) < 0.35*s && dist(lm[0],lm[12]) < 1.3*s; }
function chinCupCount(d){
  let best=0;
  for(const f of d.faces){ const chin=f[152], fw=Math.abs(f[454].x-f[234].x);
    const c=d.hands.filter(h=>{const w=h.lm[0]; return Math.abs(w.x-chin.x)<fw*1.2 && w.y>chin.y-fw*0.35 && w.y<chin.y+fw*1.1;}).length;
    best=Math.max(best,c); }
  return best;
}

async function loadAI(){
  const chip = $("#aiStatus");
  try{
    let vision;
    try { vision = await import(`${MP_BASE}/vision_bundle.mjs`); }
    catch { vision = await import(MP_BASE); }
    const { FilesetResolver, FaceLandmarker, GestureRecognizer, PoseLandmarker } = vision;
    const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const make = async (Cls, url, extra) => {
      for (const delegate of ["GPU","CPU"]) {
        try { return await Cls.createFromOptions(fileset, { baseOptions:{ modelAssetPath:url, delegate }, runningMode:"VIDEO", ...extra }); }
        catch(e){ if(delegate==="CPU") throw e; }
      }
    };
    ai.face = await make(FaceLandmarker, MODELS.face, { numFaces:8, outputFaceBlendshapes:true });
    if(S.demo) return;
    ai.ready = true;
    updateStatusChip();
    // 손·몸 모델은 뒤에서 이어서 로드
    make(GestureRecognizer, MODELS.gesture, { numHands:8 }).then(m=>ai.gesture=m).catch(e=>console.warn("gesture",e));
    make(PoseLandmarker, MODELS.pose, { numPoses:4 }).then(m=>ai.pose=m).catch(e=>console.warn("pose",e));
  }catch(e){
    console.warn("AI load failed", e);
    ai.failed = true;
    if(S.demo) return;
    updateStatusChip();
    $("#countChip").innerHTML = S.style==="classic" ? "📸 프레임을 고르고 촬영을 시작하세요" : "📸 AI 없이도 촬영할 수 있어요";
  }
}

   ========================================================= */
let lastRun = 0; const countHist = [];
function loop(){
  requestAnimationFrame(loop);
  if(!ai.ready || video.readyState < 2) return;
  const now = performance.now();
  if(now - lastRun < 70) return; lastRun = now;
  try{
    const fr = ai.face.detectForVideo(video, now);
    latest.faces = fr.faceLandmarks || [];
    latest.blend = (fr.faceBlendshapes || []).map(b => { const o={}; for(const c of b.categories) o[c.categoryName]=c.score; return o; });
    if((need.hands || S.debug) && ai.gesture){
      const gr = ai.gesture.recognizeForVideo(video, now);
      latest.hands = (gr.landmarks||[]).map((lm,i)=>({ lm, gesture: gr.gestures?.[i]?.[0]?.categoryName || "None" }));
    } else latest.hands = [];
    if((need.pose || S.debug) && ai.pose){
      const pr = ai.pose.detectForVideo(video, now);
      latest.poses = pr.landmarks || [];
    } else latest.poses = [];
  }catch(e){ console.warn(e); }

  if(S.screen==="start"){
    countHist.push(latest.faces.length); if(countHist.length>12) countHist.shift();
    const med = [...countHist].sort((a,b)=>a-b)[Math.floor(countHist.length/2)];
    if(med !== S.headcount){ S.headcount = med; renderHeadcount(); }
  }
  const lc=$("#liveCount"); lc.classList.add("show"); lc.textContent=`👥 ${latest.faces.length}명 인식 중`;
  drawOverlay();
  if(S.debug) renderDebug();
}

function drawOverlay(){
  const r = overlay.getBoundingClientRect(), dpr = devicePixelRatio||1;
  if(overlay.width !== Math.round(r.width*dpr)){ overlay.width=Math.round(r.width*dpr); overlay.height=Math.round(r.height*dpr); }
  const W=overlay.width, H=overlay.height; octx.clearRect(0,0,W,H);
  if((S.screen!=="start" || S.style==="classic") && !S.debug) return;
  const sc = Math.max(W/vw(), H/vh()), dw=vw()*sc, dh=vh()*sc, ox=(W-dw)/2, oy=(H-dh)/2;
  const X = x => W - (ox + x*dw), Y = y => oy + y*dh;     // 거울 모드에 맞춰 좌우 반전
  latest.faces.forEach((f,i)=>{
    let x0=1,x1=0,y0=1,y1=0; for(const p of f){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
    const L=X(x1), R=X(x0), T=Y(y0)-12*dpr, B=Y(y1)+6*dpr, k=Math.min(R-L,B-T)*0.22;
    octx.strokeStyle="#22d3c5"; octx.lineWidth=4*dpr; octx.lineCap="round";
    octx.beginPath();
    octx.moveTo(L,T+k);octx.lineTo(L,T);octx.lineTo(L+k,T); octx.moveTo(R-k,T);octx.lineTo(R,T);octx.lineTo(R,T+k);
    octx.moveTo(L,B-k);octx.lineTo(L,B);octx.lineTo(L+k,B); octx.moveTo(R-k,B);octx.lineTo(R,B);octx.lineTo(R,B-k);
    octx.stroke();
    const label=`사람 ${i+1}`; octx.font=`${15*dpr}px -apple-system,sans-serif`;
    const tw=octx.measureText(label).width+16*dpr;
    octx.fillStyle="#22d3c5"; octx.fillRect(L, T-26*dpr, tw, 24*dpr);
    octx.fillStyle="#04201d"; octx.fillText(label, L+8*dpr, T-9*dpr);
  });
  if(S.debug){
    octx.fillStyle="#ffb547";
    latest.hands.forEach(h=>h.lm.forEach(p=>{octx.beginPath();octx.arc(X(p.x),Y(p.y),3*dpr,0,7);octx.fill();}));
    octx.fillStyle="#ff5c8a";
    latest.poses.forEach(p=>[0,11,12,13,14,15,16].forEach(i=>{octx.beginPath();octx.arc(X(p[i].x),Y(p[i].y),5*dpr,0,7);octx.fill();}));
  }
}

/* 최근에 나온 미션은 잠시 빼고 뽑기 → 연속 촬영해도 미션이 겹치지 않음 */
let recentMissions = [];
try { recentMissions = JSON.parse(localStorage.getItem("recentMissions") || "[]"); } catch {}
function pickFresh(list, exclude=[]){
  const avoid = new Set([...recentMissions, ...exclude.map(m=>m.title)]);
  const fresh = list.filter(m=>!avoid.has(m.title));
  const pool = fresh.length ? fresh : list.filter(m=>!exclude.includes(m));
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickMissions(n){
  const f1 = pickFresh(MISSIONS.face);
  const hand = pickFresh(MISSIONS.hand);
  const body = pickFresh(n>=3 ? MISSIONS.body.filter(m=>m.title!=="T자 비행기") : MISSIONS.body);   // 3명 이상이면 T자 비행기 제외
  const last = n>=2 ? pickFresh(MISSIONS.group) : pickFresh(MISSIONS.face, [f1]);
  const set = [f1, hand, body, last];
  recentMissions = [...set.map(m=>m.title), ...recentMissions].slice(0, 12);   // 최근 3번 촬영분 기억
  try { localStorage.setItem("recentMissions", JSON.stringify(recentMissions)); } catch {}
  return shuffle(set);
}

function buildThumbs(){
  const t=$("#thumbs"); t.innerHTML="";
  for(let i=0;i<4;i++){ const d=document.createElement("div"); d.className="thumb"; d.textContent=i+1; t.appendChild(d); }
}

function waitFrames(fn){ return new Promise(res=>{ const tick=()=>{ const v=fn(); if(v!==undefined) res(v); else requestAnimationFrame(tick); }; tick(); }); }

const CLASSIC_HINTS = ["브이도 좋고 하트도 좋아요 ✌️","이번엔 다른 포즈로! 🙌","옆 사람과 더 가까이 🤗","마지막! 제일 웃긴 표정으로 🤪"];
async function runSession(){
  if(!S.demo && video.readyState < 2) return;
  if(S.debug) $("#debugBtn").click();
  const classic = S.style==="classic";
  S.abort=false; S.n = Math.max(1, S.headcount||1); S.shots=[];
  if(!classic) S.missions = pickMissions(ai.ready ? S.n : 1);
  show("shoot"); buildThumbs();
  if(qrEnabled()) TL.start();
  const nav = navigator; try{ S.wake = await nav.wakeLock?.request("screen"); }catch{}

  for(let i=0;i<4;i++){
    if(S.abort) break;
    const th = $("#thumbs").children[i]; th.classList.add("now");
    let m, success=false;
    if(classic){
      m = { emoji:"📸", title:`SHOT ${i+1}` };
      $("#mStep").textContent = `SHOT ${i+1} / 4`;
      $("#mTitle").textContent = "📸 포즈 준비!";
      $("#mDesc").textContent = CLASSIC_HINTS[i];
      TL.label = `📸 SHOT ${i+1}/4`;
      $("#mission").classList.add("show");
      await sleep(1000);
    } else {
      m = S.missions[i];
      need = { hands:!!m.hands, pose:!!m.pose };
      $("#mStep").textContent = `MISSION ${i+1} / 4`;
      $("#mTitle").textContent = `${m.emoji} ${m.title}`;
      $("#mDesc").textContent = m.desc;
      TL.label = `MISSION ${i+1}/4  ${m.emoji} ${m.title}`;
      $("#mission").classList.add("show");
      await sleep(700);

      // 미션 인식 대기
      const limit = (ai.ready ? CONFIG.missionTimeout : Math.min(3,CONFIG.missionTimeout)) * 1000;
      const t0 = performance.now(); let holdStart = null, lastN = null;
      const timer=$("#timer"), fill=$("#timerFill"); timer.classList.add("show");
      success = await waitFrames(()=>{
        if(S.abort) return false;
        const el = performance.now()-t0;
        fill.style.transform = `scaleX(${Math.max(0,1-el/limit)})`;
        // 남은 3초: 안내 문구 + 3·2·1 (시간이 끝나면 추가 대기 없이 바로 촬영)
        const left = Math.ceil((limit-el)/1000);
        if(left<=3 && left>=1 && left!==lastN){
          if(lastN===null) $("#mDesc").textContent = "⏰ 곧 찍혀요! 포즈 그대로~";
          lastN = left; popCount(left); TL.count = left;
        }
        let ok=false; if(ai.ready){ try{ ok = m.check(latest); }catch{ ok=false; } }
        if(ok){ holdStart ??= performance.now(); if(performance.now()-holdStart >= CONFIG.holdMs) return true; }
        else holdStart = null;
        if(el >= limit) return false;
      });
      timer.classList.remove("show");
      TL.count = null; $("#count").classList.remove("pop");
      if(S.abort) break;
      if(success) await flashBanner("인식 성공! ✨", 900);                           // 성공했을 때만 배너 + 3·2·1
    }

    if(classic || success){
      const cd = classic ? CONFIG.classicCountdown : CONFIG.countdown;
      for(let c=cd;c>=1;c--){ if(S.abort) break; popCount(c); TL.count=c; await sleep(1000); }
      TL.count=null;
    }
    if(S.abort) break;

    const stats = classic ? {} : snapshot();
    const img = captureFrame(PHOTO_RATIO);                                       // 인원·모드와 관계없이 3:2 고정
    $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
    TL.grab(true);
    S.shots.push({ img, success, mission:m, aiOn: !classic && ai.ready, ...stats });
    th.classList.remove("now"); th.classList.add("done"); th.textContent="";
    th.style.backgroundImage = `url(${img.toDataURL("image/jpeg",0.6)})`;
    $("#mission").classList.remove("show");
    await sleep(800);
  }
  need = { hands:false, pose:false };
  TL.stop(); TL.label="";
  $("#mission").classList.remove("show");
  try{ S.wake?.release(); }catch{}
  if(S.abort || S.shots.length<4){ goHome(); return; }
  await finish();
}

function snapshot(){
  if(!ai.ready || !latest.blend.length) return { smile:null, jaw:null, faces:latest.faces.length };
  return { smile: avg(latest.blend.map(smileOf)), jaw: avg(latest.blend.map(b=>b.jawOpen||0)), faces: latest.faces.length };
}

async function flashBanner(text, ms){
  const b=$("#banner"); b.textContent=text; b.classList.add("show"); TL.banner=text; await sleep(ms); b.classList.remove("show"); TL.banner=""; await sleep(150);
}
function popCount(n){ const c=$("#count"); c.textContent=n; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }

function captureFrame(aspect){
  const W=vw(), H=vh(); let sw,sh;
  if(W/H > aspect){ sh=H; sw=H*aspect; } else { sw=W; sh=W/aspect; }
  const sx=(W-sw)/2, sy=(H-sh)/2;
  const outW = aspect>1 ? 1200 : 900, outH = Math.round(outW/aspect);
  const c=document.createElement("canvas"); c.width=outW; c.height=outH;
  const x=c.getContext("2d");
  if(!S.demo){ x.translate(outW,0); x.scale(-1,1); }                     // 거울 모드 그대로 저장
  x.drawImage(source(), sx,sy,sw,sh, 0,0,outW,outH);
  return c;
}

   AI 리포트
   ========================================================= */
function buildReport(shots, n){
  const success = shots.filter(s=>s.success).length;
  const smiles = shots.map(s=>s.smile).filter(v=>v!=null);
  const aiOn = ai.ready && smiles.length>0;
  const cats = [];
  let smilePct = null;
  if(aiOn){
    smilePct = Math.round(Math.min(1, avg(smiles)*1.25)*100);
    const surprise = shots.filter(s=>(s.jaw||0)>0.35).length;
    if(smilePct>=70) cats.push("happy");
    if(surprise>=2) cats.push("surprise");
    cats.push(success===4 ? "perfect" : success>=2 ? "mid" : "chaos");
    if(shots.some(s=>s.mission.group && s.success)) cats.push("sync");
    if(smilePct<30) cats.push("chic");
    if(Math.max(...smiles)-Math.min(...smiles) > 0.5) cats.push("multi");
    if(n===1) cats.push("solo");
    if(n>=5) cats.push("big");
  } else cats.push("happy");
  const cat = pick(cats);
  const date = new Date(), ds = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,"0")}.${String(date.getDate()).padStart(2,"0")}`;
  return {
    comment: pick(PHRASES[cat]), tail: pick(TAILS), title: pick(TITLES[cat]),
    stats: aiOn ? `😆 웃음지수 ${smilePct}% · 🎯 미션 ${success}/4` : `📸 AI 포즈 미션 4컷 완료`,
    short: aiOn ? `😆 웃음 ${smilePct}% · 🎯 미션 ${success}/4` : `📸 미션 4컷 완료`,
    date: ds,
  };
}

/* =========================================================
   프레임 합성 (1200 × 1776px = 엽서 100×148mm, 가로 1200px 기준)
   ========================================================= */
const FONT_FUN = `"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
const FONT_UI  = `-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fitText(ctx, text, cx, y, maxW, size, family, color, weight=""){
  let s=size; do { ctx.font=`${weight} ${s}px ${family}`; if(ctx.measureText(text).width<=maxW) break; s-=1; } while(s>10);
  ctx.fillStyle=color; ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillText(text, cx, y);
}
function seeded(seed){ return () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function sparkle(ctx,x,y,r,color){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r); ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
  ctx.fill(); ctx.restore();
}
function drawUnitBg(ctx,x,y,w,h,theme,gutter){
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,"#0b1342"); g.addColorStop(.5,"#0f1a55"); g.addColorStop(1,"#080d33");
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  // 은은한 빛 번짐
  for(const [cx,cy,r,c,a] of [[x+w*.9,y+h*.08,w*.75,theme.accent,.30],[x+w*.05,y+h*.92,w*.8,theme.accent2,.24],[x+w*.5,y+h*.5,w*.9,"#3b4bff",.10]]){
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,hexA(c,a)); rg.addColorStop(1,hexA(c,0));
    ctx.fillStyle=rg; ctx.fillRect(x,y,w,h);
  }
  // 모눈 격자
  ctx.strokeStyle="rgba(140,170,255,.07)"; ctx.lineWidth=1; ctx.beginPath();
  for(let xx=x+12; xx<x+w; xx+=24){ ctx.moveTo(xx,y); ctx.lineTo(xx,y+h); }
  for(let yy=y+12; yy<y+h; yy+=24){ ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); }
  ctx.stroke();
  // 회로 패턴 (양옆 여백)
  const rnd = seeded(h*7+w);
  ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round";
  const traces = Math.round(h/70);
  for(let k=0;k<traces;k++){
    const left = k%2===0, ex = left ? x : x+w, dir = left ? 1 : -1;
    const ty = y + 40 + rnd()*(h-80), a = 6+rnd()*(gutter*.3), d = 8+rnd()*(gutter*.3), L = 20+rnd()*70, down = rnd()<.5 ? 1 : -1;
    const color = hexA(rnd()<.6 ? theme.accent : theme.accent2, .45);
    ctx.strokeStyle=color; ctx.beginPath();
    ctx.moveTo(ex,ty); ctx.lineTo(ex+dir*a,ty); ctx.lineTo(ex+dir*(a+d),ty+down*d); ctx.lineTo(ex+dir*(a+d),ty+down*(d+L)); ctx.stroke();
    ctx.fillStyle="#0b1342"; ctx.beginPath(); ctx.arc(ex+dir*(a+d),ty+down*(d+L),4.5,0,7); ctx.fill(); ctx.stroke();
    if(rnd()<.5){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(ex+dir*a,ty,2.5,0,7); ctx.fill(); }
  }
  // 반짝이
  for(let k=0;k<Math.round(h/220);k++){
    const sx = rnd()<.5 ? x+10+rnd()*(gutter-24) : x+w-gutter+14+rnd()*(gutter-24);
    sparkle(ctx, sx, y+30+rnd()*(h-60), 5+rnd()*6, hexA("#ffffff", .5+rnd()*.3));
  }
  ctx.restore();
}
function hudCorners(ctx,x,y,w,h,off,len,color){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap="round"; ctx.beginPath();
  const L=x-off, R=x+w+off, T=y-off, B=y+h+off;
  ctx.moveTo(L,T+len);ctx.lineTo(L,T);ctx.lineTo(L+len,T); ctx.moveTo(R-len,T);ctx.lineTo(R,T);ctx.lineTo(R,T+len);
  ctx.moveTo(L,B-len);ctx.lineTo(L,B);ctx.lineTo(L+len,B); ctx.moveTo(R-len,B);ctx.lineTo(R,B);ctx.lineTo(R,B-len);
  ctx.stroke(); ctx.restore();
}
function pill(ctx, text, x, y, size, theme, align="left"){
  ctx.font=`${size}px ${FONT_FUN}`; const tw=ctx.measureText(text).width+size*1.1, th=size*1.75;
  const px = align==="right" ? x-tw : x;
  ctx.save(); rr(ctx,px,y,tw,th,th/2); ctx.fillStyle="rgba(8,13,51,.78)"; ctx.fill();
  ctx.strokeStyle=hexA(theme.accent,.8); ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
  ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(text, px+size*.55, y+th/2+1);
}
function drawPhoto(ctx, shot, i, x,y,w,h, small, theme){
  ctx.save(); ctx.shadowColor=hexA(theme.accent,.7); ctx.shadowBlur=small?12:18;
  rr(ctx,x-3,y-3,w+6,h+6,12); ctx.fillStyle="#e6ecff"; ctx.fill(); ctx.restore();
  ctx.save(); rr(ctx,x,y,w,h,10); ctx.clip(); ctx.drawImage(shot.img,x,y,w,h); ctx.restore();
  const mark = shot.aiOn ? (shot.success?" 👾":" 🌀") : "";                  // 성공 👾 · 실패 🌀
  const em = shot.mission.emoji.slice(0,2);
  if(small){
    pill(ctx, `${em} ${shot.mission.title}${mark}`, x+6, y+h-27, 12, theme);
    pill(ctx, `SCAN 0${i+1}`, x+w-6, y+6, 9, theme, "right");
  } else {
    pill(ctx, `${em} ${shot.mission.title}${mark}`, x+8, y+h-36, 16, theme);
    pill(ctx, `SCAN 0${i+1}`, x+w-8, y+8, 11, theme, "right");
  }
}
function textL(ctx, text, x, y, maxW, size, family, color, weight=""){
  let s=size; do { ctx.font=`${weight} ${s}px ${family}`; if(ctx.measureText(text).width<=maxW) break; s-=1; } while(s>9);
  ctx.fillStyle=color; ctx.textAlign="left"; ctx.textBaseline="alphabetic"; ctx.fillText(text, x, y);
}
// align: "center" → cx가 가운데, "left" → cx가 왼쪽 끝, "right" → cx가 오른쪽 끝
function drawLogoRow(ctx, cx, cy, r, s1, s2, theme, align="center"){
  ctx.font=`${s1}px ${FONT_FUN}`; const w1=ctx.measureText(CONFIG.footer1).width;
  ctx.font=`${s2}px ${FONT_FUN}`; const w2=ctx.measureText(CONFIG.footer2).width;
  const gap = logoOk ? r*.55 : 0, logoW = logoOk ? r*2 : 0, tw=Math.max(w1,w2), total=logoW+gap+tw;
  const lx = align==="center" ? cx-total/2 : align==="right" ? cx-total : cx, tx = lx+logoW+gap;
  if(logoOk){

/* =========================================================

const QR = (() => {

      const ecc=remainder(dat,div); if(i<nShort) dat.push(0); blocks.push(dat.concat(ecc)); }

      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=M[y][x]; if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1]) p+=3; }

const TL = {
  frames:[], n:0, timer:null, on:false, label:"", step:0, count:null, banner:"", c:null, x:null,
  start(){

  draw(flash){

      const tw=x.measureText(t).width+28; rr(x,(w-tw)/2,h-52,tw,36,18); x.fillStyle="rgba(7,11,36,.72)"; x.fill();
      x.fillStyle="#fff"; x.textAlign="center"; x.fillText(t, w/2, h-33);

      x.strokeText(this.banner,w/2,h/2); x.fillStyle="#fff"; x.fillText(this.banner,w/2,h/2); }

function blobToImage(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob), im=new Image();
  im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=e=>{ URL.revokeObjectURL(u); rej(e); }; im.src=u; }); }
async function buildTimelapse(endCanvas){
  if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error("이 기기는 영상 만들기를 지원하지 않아요");
  await sleep(200);                                                              // 마지막 프레임 저장 대기
  const frames = TL.frames.filter(Boolean);
  if(frames.length < 5) throw new Error("frames too few");
  const w=TL.c.width, h=TL.c.height;
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  const types=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm"];
  const mime=types.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch{ return false; } }) || "";
  const bg=()=>{ const g=x.createLinearGradient(0,0,0,h); const cl=S.style==="classic"; g.addColorStop(0,cl?"#1d1a20":"#0b1342"); g.addColorStop(1,cl?"#121114":"#080d33"); x.fillStyle=g; x.fillRect(0,0,w,h); };
  bg();
  const stream=c.captureStream(30);
  const rec=new MediaRecorder(stream, mime ? { mimeType:mime, videoBitsPerSecond:2500000 } : { videoBitsPerSecond:2500000 });
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  const stopped=new Promise(r=>rec.onstop=r);
  rec.start(500);
  // 인트로
  bg(); x.textAlign="center"; x.textBaseline="middle";
  x.fillStyle = S.style==="classic" ? "#ff8fb1" : "#38e1ff"; x.font=`700 16px ${FONT_UI}`;
  x.fillText(S.style==="classic" ? "OUR MOMENT · MAKING FILM" : "AI POSE MISSION · MAKING FILM", w/2, h/2-30);
  x.fillStyle="#fff"; x.font=`44px ${FONT_FUN}`; x.fillText("🎬 "+boothTitle(), w/2, h/2+16);
  await sleep(900);
  // 빨리감기 본편
  const dt=1000/CONFIG.timelapseFps;
  for(const b of frames){ const t0=performance.now();
    try{ const im=await blobToImage(b); x.drawImage(im,0,0,w,h); }catch{}
    await sleep(Math.max(0, dt-(performance.now()-t0))); }
  // 엔딩: 완성된 사진
  bg(); const sc=Math.min((w-40)/endCanvas.width,(h-40)/endCanvas.height), ew=endCanvas.width*sc, eh=endCanvas.height*sc;
  x.drawImage(endCanvas,(w-ew)/2,(h-eh)/2,ew,eh);
  await sleep(600); x.drawImage(endCanvas,(w-ew)/2,(h-eh)/2,ew,eh); await sleep(1400);
  rec.stop(); await stopped; stream.getTracks().forEach(t=>t.stop());
  const type=(rec.mimeType||mime||"video/webm").split(";")[0];
  return new Blob(chunks,{ type });
}

function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function uploadFile(blob, name, timeoutMs){
  const b64 = await blobToB64(blob);
  const ctrl = new AbortController(), t = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(CONFIG.uploadUrl, { method:"POST", signal:ctrl.signal,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ data:b64, mime:blob.type||"application/octet-stream", name }) });
    const j = await res.json();
    if(!j.ok || !j.id) throw new Error(j.error || "upload failed");
    return j.id;
  } finally { clearTimeout(t); }
}
function drawQRCanvas(cv, text){
  const cx=cv.getContext("2d"), N=cv.width, q=QR.encode(text), mod=Math.floor(N/(q.size+4)), off=Math.floor((N-mod*q.size)/2);
  cx.fillStyle="#fff"; cx.fillRect(0,0,N,N); cx.fillStyle="#000";
  for(let r=0;r<q.size;r++) for(let c=0;c<q.size;c++) if(q.get(c,r)) cx.fillRect(off+c*mod, off+r*mod, mod, mod);
}

async function finish(){
  const classic = S.style==="classic";
  let rep, theme;
  if(classic){ theme = classicTheme(); const ph = pick(theme.phrases); rep = { date: todayStr(), phrase: theme.wrap ? `${theme.wrap} ${ph} ${theme.wrap}` : ph }; }
  else { const n = ai.ready ? S.n : 1; rep = buildReport(S.shots, n); theme = themeFor(n); }
  const setResult = canvas => {
    S.resultCanvas = canvas; S.resultUrl = canvas.toDataURL("image/jpeg", 0.95);
    $("#resultImg").src = S.resultUrl; $("#printImg").src = S.resultUrl;
  };
  setResult(await compose(S.shots, S.mode, rep, theme, null));
  $("#rC1").textContent = classic ? `${theme.emoji} ${rep.phrase.replace("\n","  ")}` : S.mode===2 ? `${rep.comment}  ${rep.tail}` : `${rep.title}`;
  $("#rC2").textContent = classic ? `${theme.name} 프레임 · ${rep.date}` : rep.stats;
  show("result");

  $("#qrBox").classList.remove("show");
  let left = CONFIG.resultIdle;
  const tick = () => { $("#idleMsg").textContent = `${left}초 뒤 처음 화면으로 돌아가요`; if(left--<=0) goHome(); };
  tick(); clearInterval(S.idleTimer); S.idleTimer = setInterval(tick, 1000);
  if(qrEnabled()){
    const box=$("#qrBox"), msg=$("#qrMsg"), cv=$("#qrCanvas"), cx=cv.getContext("2d");
    const sess = S.sessionId = Date.now();
    const say = t => { if(S.sessionId===sess) msg.innerHTML = `<b>📱 사진·영상 받기</b><br>${t}`; };
    cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
    say("📸 사진 올리는 중…<br>🎬 영상 만드는 중…"); box.classList.add("show");
    const d=new Date(), stamp=`${d.getMonth()+1}${String(d.getDate()).padStart(2,"0")}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}`;
    const prefix = filePrefix();
    const digital = await composeDigital(S.shots, S.mode, rep, theme);
    let photoDone=false, videoDone=false;
    const status = () => say(`${photoDone?"📸 사진 준비 완료":"📸 사진 올리는 중…"}<br>${videoDone?"🎬 영상 준비 완료":"🎬 영상 만드는 중…"}`);
    const pPhoto = (async()=>{ const b=await new Promise(r=>digital.toBlob(r,"image/jpeg",0.9));
      const id=await uploadFile(b, `${prefix}_${stamp}.jpg`, 30000); photoDone=true; status(); return id; })();
    const pVideo = (async()=>{ const v=await buildTimelapse(digital);
      const ext=v.type.includes("mp4")?"mp4":"webm";
      const id=await uploadFile(v, `${prefix}_${stamp}.${ext}`, 90000); videoDone=true; status(); return id; })();
    const [rp, rv] = await Promise.allSettled([pPhoto, pVideo]);
    if(rv.status==="rejected") console.warn("timelapse", rv.reason);
    if(S.sessionId!==sess) return;
    if(rp.status==="fulfilled"){
      const url = new URL("view.html", location.href);
      url.search = `?p=${rp.value}` + (rv.status==="fulfilled" ? `&v=${rv.value}` : "") + (classic ? "&t=c" : S.style==="event" ? "&t=e" : "");
      drawQRCanvas(cv, url.href);
      say(rv.status==="fulfilled" ? "휴대폰 카메라로<br>QR을 찍어주세요" : "휴대폰 카메라로 찍어주세요<br><small>(이번엔 사진만 있어요)</small>");
      left = CONFIG.resultIdle;                                                  // QR이 뜨면 대기 시간 다시 시작
    } else {
      console.warn("QR upload", rp.reason);
      say("⚠️ 지금은 QR을 만들 수 없어요<br>인터넷 연결을 확인해주세요");
    }
  }
}

const boothTitle = () => S.style==="classic" ? "오늘의 네컷" : S.style==="event" ? "신나는 AI교실" : CONFIG.title;
const filePrefix = () => S.style==="classic" ? "오늘의네컷" : S.style==="event" ? "신나는AI교실" : "오늘의AI포토";
function todayStr(){ const d=new Date(); return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")}`; }
const FONT_SCRIPT = `"Dancing Script","Snell Roundhand",cursive`;

function classicBg(ctx,x,y,w,h,t,gutter){
  const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,t.bg[0]); g.addColorStop(1,t.bg[1]);
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const rnd = seeded(h*3+w+t.id.length*97);
  if(t.minimal){
    ctx.strokeStyle=hexA(t.dark?"#ffffff":"#000000", .18); ctx.lineWidth=1.5; ctx.strokeRect(x+18,y+18,w-36,h-36);
    for(let k=0;k<Math.round(h/300);k++) sparkle(ctx, rnd()<.5 ? x+30+rnd()*(gutter-40) : x+w-gutter+10+rnd()*(gutter-40), y+60+rnd()*(h-120), 4+rnd()*4, hexA(t.dark?"#ffffff":"#000000",.35));
  }
  if(t.snow){ ctx.fillStyle=hexA(t.snow,.55); for(let k=0;k<h/9;k++){ ctx.beginPath(); ctx.arc(x+rnd()*w, y+rnd()*h, 1.5+rnd()*3, 0, 7); ctx.fill(); } }
  if(t.confetti){ const cs=["#ff7aa8","#ffc94d","#7ad3ff","#a98bff","#7be3b0"];
    for(let k=0;k<h/14;k++){ ctx.save(); ctx.translate(x+rnd()*w, y+rnd()*h); ctx.rotate(rnd()*6.28);
      ctx.fillStyle=cs[Math.floor(rnd()*cs.length)]; ctx.globalAlpha=.7; ctx.fillRect(-5,-2.5,10,5); ctx.restore(); } }
  if(t.seollal) drawSeollal(ctx,x,y,w,h,gutter,rnd);
  if(t.dots){ ctx.fillStyle=t.dots; for(let yy=y+14; yy<y+h; yy+=28) for(let xx=x+((yy/28|0)%2?14:0)+7; xx<x+w; xx+=28){ ctx.beginPath(); ctx.arc(xx,yy,3.2,0,7); ctx.fill(); } }
  if(t.paws){
    // 양옆으로 걸어가는 발자국
    for(const side of [0,1]){
      const bx = side ? x+w-gutter/2 : x+gutter/2;
      for(let yy=y+50, k=0; yy<y+h-30; yy+=58, k++){
        const off = (k%2 ? 1 : -1) * gutter*0.16;
        paw(ctx, bx+off, yy + (side?29:0), Math.min(15, gutter*0.22), hexA(t.paws, .28), (side?-1:1)*0.25 + (k%2?0.15:-0.15));
      }
    }
  }
  if(t.deco.length){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    const n=Math.round(h/95);
    for(let k=0;k<n;k++){
      const left=k%2===0, size=24+rnd()*20;
      const cx = left ? x+10+rnd()*(gutter-14) : x+w-gutter+4+rnd()*(gutter-14);
      ctx.save(); ctx.translate(cx, y+30+rnd()*(h-60)); ctx.rotate((rnd()-.5)*0.9); ctx.globalAlpha=.9;
      ctx.font=`${size}px sans-serif`; ctx.fillStyle="#000"; ctx.fillText(t.deco[Math.floor(rnd()*t.deco.length)],0,0); ctx.restore();
    }
  }
  // 설날 보름달 (장식 위에 그림)
  if(t.seollal) fullMoon(ctx, x+w-70, y+h-104, 30);                      // 보름달: 오른쪽 아래 문구 옆
  ctx.restore();
}
// 발자국
function paw(ctx, x, y, s, color, rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0, s*0.35, s*0.62, s*0.5, 0, 0, 7); ctx.fill();
  for(const [dx,dy,r] of [[-0.62,-0.28,0.24],[-0.22,-0.66,0.26],[0.22,-0.66,0.26],[0.62,-0.28,0.24]]){
    ctx.beginPath(); ctx.ellipse(dx*s, dy*s, r*s, r*s*1.2, dx*0.4, 0, 7); ctx.fill(); }
  ctx.restore();
}
// 사진 묶음 위에 귀 달기 (고양이: 뾰족귀, 강아지: 늘어진 귀)
function drawEars(ctx, kind, x, y, w, size){
  ctx.save();
  if(kind==="cat"){
    for(const [cx,dir] of [[x+size*1.4,-1],[x+w-size*1.4,1]]){
      ctx.beginPath(); ctx.moveTo(cx-size*0.85, y+2); ctx.lineTo(cx+dir*size*0.25, y-size*1.15); ctx.lineTo(cx+size*0.85, y+2); ctx.closePath();
      ctx.fillStyle="#1c1c1c"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx-size*0.45, y); ctx.lineTo(cx+dir*size*0.18, y-size*0.68); ctx.lineTo(cx+size*0.45, y); ctx.closePath();
      ctx.fillStyle="#f6b6c8"; ctx.fill();
    }
  } else {
    for(const [cx,dir] of [[x+size*0.55,-1],[x+w-size*0.55,1]]){
      ctx.save(); ctx.translate(cx, y-size*0.15); ctx.rotate(dir*0.22);
      ctx.shadowColor="rgba(0,0,0,.18)"; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
      ctx.beginPath(); ctx.moveTo(-size*0.45,0);
      ctx.bezierCurveTo(-size*0.9,size*0.6,-size*0.7,size*1.9,0,size*2.05);
      ctx.bezierCurveTo(size*0.7,size*1.9,size*0.9,size*0.6,size*0.45,0); ctx.closePath();
      ctx.fillStyle="#8a5a36"; ctx.fill(); ctx.shadowColor="transparent";
      ctx.beginPath(); ctx.ellipse(0, size*1.1, size*0.3, size*0.7, 0, 0, 7); ctx.fillStyle="#b9875f"; ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}
// 설날: 색동 띠 + 복주머니
const SAEKDONG = ["#e8434b","#f6c445","#3ba86a","#3b6fd1","#f28bb3","#ffffff","#8a56c9"];
function saekdongBand(ctx, x, y, w, h, vertical){
  const n = SAEKDONG.length, step = (vertical ? h : w) / (n*2);
  for(let i=0;i<n*2;i++){ ctx.fillStyle = SAEKDONG[i%n];
    if(vertical) ctx.fillRect(x, y+i*step, w, step+0.5); else ctx.fillRect(x+i*step, y, step+0.5, h); }
}
function bokjumeoni(ctx, cx, cy, s, body, band){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s/40, s/40);
  // 몸통
  ctx.beginPath(); ctx.moveTo(-14,-10); ctx.bezierCurveTo(-26,2,-24,26,0,28); ctx.bezierCurveTo(24,26,26,2,14,-10); ctx.closePath();
  ctx.fillStyle=body; ctx.fill();
  // 주름 입구
  ctx.beginPath(); ctx.moveTo(-14,-10); ctx.quadraticCurveTo(-18,-22,-8,-24); ctx.lineTo(8,-24); ctx.quadraticCurveTo(18,-22,14,-10); ctx.closePath();
  ctx.fillStyle=body; ctx.fill(); ctx.fillStyle="rgba(0,0,0,.12)"; ctx.fill();
  // 금색 띠 + 매듭
  ctx.fillStyle=band; ctx.fillRect(-15,-12,30,4);
  ctx.beginPath(); ctx.arc(-5,-15,4,0,7); ctx.arc(5,-15,4,0,7); ctx.fill();
  // 글자 '복'
  ctx.fillStyle="#fff7e0"; ctx.font=`16px ${FONT_FUN}`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("복",0,9);
  ctx.restore();
}
function fullMoon(ctx, cx, cy, r){
  ctx.save();
  const glow=ctx.createRadialGradient(cx,cy,r*0.6,cx,cy,r*1.9); glow.addColorStop(0,"rgba(255,214,120,.45)"); glow.addColorStop(1,"rgba(255,214,120,0)");
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,r*1.9,0,7); ctx.fill();
  const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r); g.addColorStop(0,"#fff6cf"); g.addColorStop(1,"#f6c445");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.fillStyle="rgba(214,160,40,.25)";                                         // 달 무늬
  for(const [dx,dy,rr] of [[-0.3,-0.15,0.18],[0.25,0.2,0.22],[0.05,-0.42,0.1],[-0.1,0.4,0.12]]){ ctx.beginPath(); ctx.arc(cx+dx*r,cy+dy*r,rr*r,0,7); ctx.fill(); }
  ctx.restore();
}
function drawSeollal(ctx,x,y,w,h,gutter,rnd){
  // 위·아래 색동 띠
  saekdongBand(ctx, x, y, w, 16, false); saekdongBand(ctx, x, y+h-16, w, 16, false);
  // 은은한 구름 문양
  ctx.strokeStyle="rgba(179,40,58,.12)"; ctx.lineWidth=2;
  for(let k=0;k<Math.round(h/160);k++){ const cx = k%2 ? x+gutter*.5 : x+w-gutter*.5, cy=y+60+rnd()*(h-120);
    ctx.beginPath(); ctx.arc(cx,cy,10,Math.PI,0); ctx.arc(cx+14,cy,7,Math.PI,0); ctx.arc(cx-12,cy+2,6,Math.PI,0); ctx.stroke(); }
  // 복주머니
  const pouches=[["#e8434b","#f6c445"],["#3b6fd1","#f6c445"],["#f28bb3","#f6c445"],["#3ba86a","#f6c445"]];
  for(let k=0;k<Math.max(2,Math.round(h/360));k++){
    const left=k%2===0, [b,g]=pouches[k%pouches.length];
    bokjumeoni(ctx, left ? x+gutter*.5 : x+w-gutter*.5, y+90+rnd()*(h-180), 34+rnd()*10, b, g);
  }
}
function classicPhoto(ctx, shot, x,y,w,h,t){
  ctx.save();
  if(t.id==="white"){ ctx.drawImage(shot.img,x,y,w,h); ctx.strokeStyle="#e2e2e2"; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h); }
  else {
    ctx.shadowColor="rgba(0,0,0,.18)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
    ctx.fillStyle = t.dark && t.minimal ? "#2c2c2c" : "#ffffff"; ctx.fillRect(x-5,y-5,w+10,h+10);
    ctx.shadowColor="transparent"; ctx.drawImage(shot.img,x,y,w,h);
  }
  ctx.restore();
}
function classicTitle(ctx, t, cx, y, size, maxW){
  if(t.minimal) fitText(ctx, t.title.split("").join(" "), cx, y, maxW, Math.round(size*.72), FONT_UI, t.ink, "800");
  else fitText(ctx, t.titleWrap ? `${t.titleWrap} ${t.title} ${t.titleWrap}` : t.title, cx, y, maxW, size, FONT_SCRIPT, t.ink, "700");
}
function drawClassicStrip(ctx, x0, shots, rep, t, o={}){                      // 600 × 1776
  const padL = o.padL ?? 30, pw = 540, px = x0+padL, cx = px+pw/2;
  const ph = Math.round(pw/PHOTO_RATIO), top = 80, gap = 10;
  if(o.bg!==false) classicBg(ctx,x0,0,600,SHEET_H,t,30);
  classicTitle(ctx, t, cx, t.ears ? 54 : 62, t.ears ? 40 : 48, t.ears ? 300 : 500);
  if(t.ears==="cat") drawEars(ctx, "cat", px, top-5, pw, 30);
  shots.forEach((s,i)=>classicPhoto(ctx, s, px, top+i*(ph+gap), pw, ph, t));
  if(t.ears==="dog") drawEars(ctx, "dog", px-5, top-5, pw+10, 34);
  const by = top+4*ph+3*gap;                                                     // ≈ 1550
  const lines = rep.phrase.split("\n"), two = lines.length>1;
  fitText(ctx, lines[0], cx, by+(two?52:60), 500, 34, FONT_FUN, t.ink);
  if(two) fitText(ctx, lines[1], cx, by+90, 500, 28, FONT_UI, t.ink, "600");
  fitText(ctx, rep.date, cx, by+(two?126:100), 500, 20, FONT_UI, t.sub, "700");
  fitText(ctx, "#오늘의네컷", cx, by+(two?156:132), 500, 15, FONT_UI, hexA(t.sub.length===7?t.sub:"#888888", .85), "600");
}
function drawClassicPiece(ctx, x0, y0, shots, rep, t){                          // 600 × 900
  classicBg(ctx,x0,y0,600,900,t,49);
  classicTitle(ctx, t, x0+300, y0+(t.ears ? 62 : 70), 36, t.ears ? 300 : 440);
  const pw=246, ph=328, gx=x0+49, gy=y0+92, gap=10;
  if(t.ears==="cat") drawEars(ctx, "cat", gx, gy-5, 2*pw+gap, 22);
  shots.forEach((s,i)=>classicPhoto(ctx, s, gx+(i%2)*(pw+gap), gy+Math.floor(i/2)*(ph+gap), pw, ph, t));
  if(t.ears==="dog") drawEars(ctx, "dog", gx-5, gy-5, 2*pw+gap+10, 24);
  const by = gy+2*ph+gap;                                                        // ≈ 758
  const lines = rep.phrase.split("\n"), two = lines.length>1;
  fitText(ctx, lines[0], x0+300, by+(two?34:42), 440, 22, FONT_FUN, t.ink);
  if(two) fitText(ctx, lines[1], x0+300, by+60, 440, 18, FONT_UI, t.ink, "600");
  fitText(ctx, rep.date, x0+300, by+(two?84:70), 440, 14, FONT_UI, t.sub, "700");
}

/* ---------- 모드 전환 / 테마 선택 UI ---------- */
S.style = (()=>{ try{ const v=localStorage.getItem("boothStyle"); return ["ai","event","classic"].includes(v) ? v : "ai"; }catch{ return "ai"; } })();
S.classicTheme = (()=>{ try{ return localStorage.getItem("boothTheme") || "spring"; }catch{ return "spring"; } })();
function updateStatusChip(){
  const chip=$("#aiStatus"); if(S.demo) return;
  if(S.style==="classic"){ chip.className="chip ok"; chip.textContent="📸 촬영 준비 완료"; return; }
  if(ai.ready){ chip.className="chip ok"; chip.textContent="🧠 AI 준비 완료"; }
  else if(ai.failed){ chip.className="chip warn"; chip.textContent="⚠️ AI 없이 촬영 (인터넷 확인)"; }
  else { chip.className="chip"; chip.textContent="🧠 AI 불러오는 중…"; }
}
function renderThemes(){
  const box=$("#themes"); box.innerHTML="";
  for(const t of CLASSIC_THEMES){
    const b=document.createElement("button"); b.className="tchip"+(t.id===S.classicTheme?" sel":"");
    b.style.background=`linear-gradient(135deg,${t.bg[0]},${t.bg[1]})`; b.style.color=t.ink;
    b.textContent=`${t.emoji} ${t.name}`;
    b.onclick=()=>{ S.classicTheme=t.id; try{ localStorage.setItem("boothTheme",t.id); }catch{} renderThemes(); };
    box.appendChild(b);
  }
}
function applyStyle(){
  const classic = S.style==="classic";
  document.body.classList.toggle("classic", classic);
  const ev = S.style==="event";
  $("#brandIco").textContent = classic ? "📸" : ev ? "🎉" : "🤖";
  $("#eventName").textContent = boothTitle();
  $("#brandSub").textContent = classic ? "인생네컷" : ev ? "개관식 AI 포즈 미션 네컷" : "AI 포즈 미션 네컷";
  document.title = classic ? "오늘의 네컷" : ev ? "신나는 AI교실 포토부스" : "AI 포토부스";
  document.querySelectorAll(".mode .rec").forEach(r=>r.textContent = classic ? "추천" : "AI 추천");
  $("#debugBtn").style.display = classic ? "none" : "";
  renderThemes(); updateStatusChip();
  if(S.demo) return;
  if(ai.failed) $("#countChip").innerHTML = classic ? "📸 프레임을 고르고 촬영을 시작하세요" : "📸 AI 없이도 촬영할 수 있어요";
  else renderHeadcount();
}
// 숨은 버튼 + 암호
let pinBuf="";
function pinRender(bad){ const d=$("#pinDots"); [...d.children].forEach((i,k)=>i.classList.toggle("on",k<pinBuf.length));
  if(bad){ d.classList.remove("bad"); void d.offsetWidth; d.classList.add("bad"); } }
function openPin(){
  pinBuf=""; pinRender();
  $("#pinModal .pinbox").classList.remove("picking");
  $("#pinSub").textContent = "암호를 입력하면 모드를 고를 수 있어요";
  $("#pinModal").classList.add("show");
}
function closePin(){ $("#pinModal").classList.remove("show"); }
function showModePick(){
  $("#pinSub").textContent = "사용할 모드를 골라주세요";
  document.querySelectorAll("#modePick button").forEach(b=>b.classList.toggle("cur", b.dataset.style===S.style));
  $("#pinModal .pinbox").classList.add("picking");
}
document.querySelectorAll("#modePick button").forEach(b=>b.onclick=()=>{
  const st=b.dataset.style;
  if(st){ S.style=st; try{ localStorage.setItem("boothStyle", st); }catch{} applyStyle(); }
  closePin();
});
(function buildPad(){
  const pad=$("#pinPad");
  ["1","2","3","4","5","6","7","8","9","취소","0","⌫"].forEach(k=>{
    const b=document.createElement("button"); b.textContent=k; if(k==="취소"||k==="⌫") b.className="t";
    b.onclick=()=>{
      if(k==="취소") return closePin();
      if(k==="⌫"){ pinBuf=pinBuf.slice(0,-1); return pinRender(); }
      if(pinBuf.length>=4) return;
      pinBuf+=k; pinRender();
      if(pinBuf.length===4){
        if(pinBuf===CONFIG.pin){
          setTimeout(showModePick, 150);
        } else { setTimeout(()=>{ pinBuf=""; pinRender(true); }, 150); }
      }
    };
    pad.appendChild(b);
  });
})();
$("#secretBtn").onclick = openPin;
$("#pinModal").onclick = e => { if(e.target.id==="pinModal") closePin(); };

function eventBg(ctx,x,y,w,h,gutter){
  const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#eef5fb");
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  // 은은한 점 격자
  ctx.fillStyle="rgba(0,92,156,.07)";
  for(let yy=y+12; yy<y+h; yy+=24) for(let xx=x+12; xx<x+w; xx+=24){ ctx.beginPath(); ctx.arc(xx,yy,1.6,0,7); ctx.fill(); }
  // 로고의 '동그라미 노드' 모양 회로 (양옆 여백)
  const rnd = seeded(h*5+w+11);
  ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round";
  for(let k=0;k<Math.round(h/80);k++){
    const left=k%2===0, ex = left ? x : x+w, dir = left ? 1 : -1;
    const ty=y+40+rnd()*(h-80), a=6+rnd()*Math.max(4,gutter*.25), L=16+rnd()*60, down=rnd()<.5?1:-1;
    const col = rnd()<.7 ? EV.blue : EV.green, r = 5+rnd()*2;
    ctx.strokeStyle=hexA(col,.28); ctx.beginPath();
    ctx.moveTo(ex,ty); ctx.lineTo(ex+dir*a,ty); ctx.lineTo(ex+dir*a,ty+down*L); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex+dir*a, ty+down*(L+r), r, 0, 7); ctx.stroke();
  }
  // 초록 빛살 (로고의 반짝이)
  for(let k=0;k<Math.max(1,Math.round(h/500));k++){
    const sx = rnd()<.5 ? x+gutter*.5 : x+w-gutter*.5, sy=y+80+rnd()*(h-160), R=9;
    ctx.strokeStyle=hexA(EV.green,.45); ctx.lineWidth=2.5;
    for(let t=0;t<8;t++){ const an=t*Math.PI/4; ctx.beginPath(); ctx.moveTo(sx+Math.cos(an)*R*.55, sy+Math.sin(an)*R*.55); ctx.lineTo(sx+Math.cos(an)*R, sy+Math.sin(an)*R); ctx.stroke(); }
  }
  ctx.restore();
}
function drawEventStrip(ctx, x0, shots, rep, theme, o={}){                    // 600 × 1776
  const padL = o.padL ?? 30, pw = 540, px = x0+padL, cx = px+pw/2;
  const ph = Math.round(pw/PHOTO_RATIO), top = 132, gap = 10;
  if(o.bg!==false) eventBg(ctx,x0,0,600,SHEET_H,30);
  // 신나는 AI교실 글씨 (맨 위)
  if(evWordmark.complete && evWordmark.naturalWidth){
    const wh=100, ww=evWordmark.naturalWidth*wh/evWordmark.naturalHeight;
    ctx.drawImage(evWordmark, cx-ww/2, 18, ww, wh);
  } else fitText(ctx, "신나는 AI교실", cx, 96, 400, 56, FONT_FUN, EV.blue);
  shots.forEach((s,i)=>drawPhoto(ctx, s, i, px, top+i*(ph+gap), pw, ph, false, EV_THEME));
  hudCorners(ctx, px, top, pw, 4*ph+3*gap, 7, 24, EV.blue);
  // AI 리포트
  const cy=top+4*ph+3*gap+16;                                                    // ≈ 1618
  ctx.save(); rr(ctx,px,cy,pw,72,14); ctx.fillStyle="rgba(0,92,156,.06)"; ctx.fill();
  ctx.strokeStyle="rgba(0,92,156,.35)"; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
  pill(ctx, "🤖 AI REPORT", px+40, cy-12, 12, EV_THEME);
  fitText(ctx, rep.comment, cx, cy+34, pw-30, 22, FONT_FUN, EV.blue);
  fitText(ctx, `${rep.stats}  ·  ${rep.date}`, cx, cy+57, pw-30, 13, FONT_UI, EV.green, "700");
  // 서울특별시교육청 | (로고) 개포중학교
  const fy = cy+72+36, sh=30, sw = evSen.naturalWidth ? evSen.naturalWidth*sh/evSen.naturalHeight : 0;
  ctx.font=`800 21px ${FONT_UI}`; const school=CONFIG.footer2, tw=ctx.measureText(school).width;
  const lr = logoOk ? 13 : 0, sep = 28, total = sw + sep + (logoOk ? lr*2+8 : 0) + tw;
  let fx = cx - total/2;
  if(sw) ctx.drawImage(evSen, fx, fy-sh/2, sw, sh);
  fx += sw;
  ctx.fillStyle=EV.ink; ctx.fillRect(fx+sep/2-1, fy-11, 2, 22); fx += sep;
  if(logoOk){ ctx.save(); ctx.beginPath(); ctx.arc(fx+lr, fy, lr, 0, 7); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle="rgba(0,0,0,.12)"; ctx.lineWidth=1; ctx.stroke(); ctx.clip();
    const sc=Math.min((lr*1.7)/logoImg.width,(lr*1.7)/logoImg.height); ctx.drawImage(logoImg, fx+lr-logoImg.width*sc/2, fy-logoImg.height*sc/2, logoImg.width*sc, logoImg.height*sc); ctx.restore(); fx += lr*2+8; }
  ctx.fillStyle=EV.ink; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.font=`800 21px ${FONT_UI}`; ctx.fillText(school, fx, fy+1);
  ctx.textBaseline="alphabetic";
}

   인쇄 / 저장
   ========================================================= */
function doPrint(){
  clearInterval(S.idleTimer); $("#idleMsg").textContent = "인쇄 창에서 용지를 '엽서(100×148mm)'로 선택해주세요";
  const img=$("#printImg");
  if(img.complete) window.print(); else img.onload=()=>window.print();
}
async function doSave(){
  clearInterval(S.idleTimer);
  const blob = await new Promise(r=>S.resultCanvas.toBlob(r,"image/jpeg",0.95));
  const file = new File([blob], `${filePrefix()}_${Date.now()}.jpg`, { type:"image/jpeg" });
  if(navigator.canShare?.({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
